[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B008",  # Allow Depends/Query in FastAPI route signatures
    "E501",  # Line length handled by formatter
    "UP007", # Use X | Y for type annotations (keep Optional for compatibility)
]

[tool.ruff.lint.isort]
known-first-party = ["app", "seed_data"]
